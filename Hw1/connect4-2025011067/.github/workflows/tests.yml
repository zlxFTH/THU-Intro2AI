name: Local homework feedback
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m connect4.submission
      - name: Stage 1 - Alpha-Beta correctness
        run: python -m pytest -q tests/test_stage1_alphabeta.py
      - name: Stage 2 - evaluation regret
        run: python -m pytest -q -s tests/test_stage2_evaluation.py
      - name: Stage 3 - move-ordering accuracy
        run: python -m pytest -q -s tests/test_stage3_ordering.py
      - name: Provided engine tests
        run: python -m pytest -q tests/test_game.py tests/test_search.py
      - name: GUI smoke test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m connect4.gui --smoke-frames 3
